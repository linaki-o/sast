name: CodeShield

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Analyse
        run: |
          sast analyze . -f sarif -f html -f json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-report/report.sarif
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: codeshield-report
          path: sast-report/
          retention-days: 14

  test:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
      - name: C unit tests
        run: python -m sast.cli test examples/sample_project

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Accuracy and speed
        run: python -m benchmarks.run_bench --mode all --json benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
          retention-days: 14

  trace:
    name: Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build the matrix
        run: sast trace examples/sample_project
      - uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: examples/sample_project/sast-report/traceability.*
          retention-days: 14
