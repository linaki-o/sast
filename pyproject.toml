[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sast"
version = "0.1.0"
description = "CodeShield - C/C++ 静态分析、单元测试与需求追踪平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeShield Team" }]
keywords = ["sast", "static-analysis", "cpp", "unit-testing", "coverage", "misra", "cwe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
gui = ["PySide6>=6.6"]
report = ["jinja2>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "cppcheck>=1.5", "clang-tidy>=18.0"]

[project.scripts]
sast = "sast.cli:main"
csa = "sast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sast*"]

[tool.setuptools.package-data]
sast = [
    "report/templates/*",
    "server/static/*",
    "server/templates/*",
    "gui/resources/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = []
addopts = "-q"
